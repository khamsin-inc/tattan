<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!--
    Tattan DMG 背景画像
    create-dmg がこの上に次の位置でアイコンを置く:
      - Tattan.app          (165, 200) — 中心、120px
      - Applications symlink (495, 200) — 中心、120px
    なので矢印は (240, 200) 〜 (420, 200) の間に収まるよう描く
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#e7eaf0"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5bcc8"/>
      <stop offset="1" stop-color="#8d95a5"/>
    </linearGradient>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>

  <!-- 中央の矢印（太め + 短め。Apple 公式 DMG 風。視覚的に左寄りに見えないよう微調整） -->
  <g stroke="#7d8595" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="265" y1="200" x2="370" y2="200"/>
    <polyline points="350,180 378,200 350,220"/>
  </g>

  <!-- 下部のヒント -->
  <text x="330" y="358" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#8d95a5" letter-spacing="0.4">
    Drag Tattan to Applications to install
  </text>
</svg>
